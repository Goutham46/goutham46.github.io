<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Circle Ball Mouse Game</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
    }
    .wrapper {
      position: relative;
    }
    canvas {
      background: #222;
      border-radius: 50%;
      display: block;
    }
    #restartBtn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 20px;
      font-size: 16px;
      display: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="wrapper">
  <canvas id="game" width="500" height="500"></canvas>
  <button id="restartBtn">Restart</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const restartBtn = document.getElementById('restartBtn');

const arena = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  radius: 200
};

const ball = {
  x: arena.x,
  y: arena.y,
  radius: 15
};

let gameOver = false;
let score = 0;

// --- Survival timer ---
let startTime = null;
let elapsedTime = 0;

// --- yellow enemy dots ---
const dots = [];
let DOT_RADIUS = 6;
let DOT_SPEED = 1.5;
let dotsPerSpawn = 1;
const BASE_SPAWN_INTERVAL = 700;
const DIFFICULTY_INTERVAL = 5000;

// --- red collectible dots ---
const collectibles = [];
const COLLECT_RADIUS = 6;
let COLLECT_SPEED = 1.2;
let collectsPerSpawn = 1;

function spawnOneDot() {
  const angle = Math.random() * Math.PI * 2;
  const spawnX = arena.x + Math.cos(angle) * arena.radius;
  const spawnY = arena.y + Math.sin(angle) * arena.radius;
  const dx = ball.x - spawnX, dy = ball.y - spawnY;
  const len = Math.hypot(dx, dy) || 1;
  dots.push({ x: spawnX, y: spawnY, radius: DOT_RADIUS, vx: (dx/len)*DOT_SPEED, vy: (dy/len)*DOT_SPEED });
}

function spawnOneCollectible() {
  const angle = Math.random() * Math.PI * 2;
  const spawnX = arena.x + Math.cos(angle) * arena.radius;
  const spawnY = arena.y + Math.sin(angle) * arena.radius;
  const dx = ball.x - spawnX, dy = ball.y - spawnY;
  const len = Math.hypot(dx, dy) || 1;
  collectibles.push({ x: spawnX, y: spawnY, radius: COLLECT_RADIUS, vx: (dx/len)*COLLECT_SPEED, vy: (dy/len)*COLLECT_SPEED });
}

function spawnDots() {
  if (gameOver) return;
  for (let i = 0; i < dotsPerSpawn; i++) spawnOneDot();
}

function spawnCollectibles() {
  if (gameOver) return;
  for (let i = 0; i < collectsPerSpawn; i++) spawnOneCollectible();
}

function increaseDifficulty() {
  if (gameOver) return;
  DOT_SPEED += 0.3; dotsPerSpawn += 1;
  COLLECT_SPEED += 0.2; collectsPerSpawn += 1;
  for (const d of dots) { const l = Math.hypot(d.vx,d.vy)||1; d.vx=(d.vx/l)*DOT_SPEED; d.vy=(d.vy/l)*DOT_SPEED; }
  for (const c of collectibles) { const l = Math.hypot(c.vx,c.vy)||1; c.vx=(c.vx/l)*COLLECT_SPEED; c.vy=(c.vy/l)*COLLECT_SPEED; }
}

function resetGame() {
  ball.x = arena.x; ball.y = arena.y;
  gameOver = false;
  dots.length = 0; collectibles.length = 0;
  restartBtn.style.display = 'none';
  score = 0;
  DOT_SPEED = 1.5; dotsPerSpawn = 1;
  COLLECT_SPEED = 1.2; collectsPerSpawn = 1;
  startTime = performance.now();
  elapsedTime = 0;
}

canvas.addEventListener('mousemove', (e) => {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  ball.x = e.clientX - rect.left;
  ball.y = e.clientY - rect.top;
  checkCircleBoundary();
});

function checkCircleBoundary() {
  if (Math.hypot(ball.x - arena.x, ball.y - arena.y) + ball.radius >= arena.radius) triggerGameOver();
}

function checkDotCollisions() {
  for (const d of dots) {
    if (Math.hypot(d.x - ball.x, d.y - ball.y) <= d.radius + ball.radius) { triggerGameOver(); return; }
  }
}

function checkCollectibleCollisions() {
  for (let i = collectibles.length - 1; i >= 0; i--) {
    const c = collectibles[i];
    if (Math.hypot(c.x - ball.x, c.y - ball.y) <= c.radius + ball.radius) {
      score += 1;
      collectibles.splice(i, 1);
    }
  }
}

function triggerGameOver() {
  if (gameOver) return;
  gameOver = true;
  elapsedTime = ((performance.now() - startTime) / 1000).toFixed(2);
  restartBtn.style.display = 'block';
}

restartBtn.addEventListener('click', () => resetGame());

function updateDots() {
  for (const d of dots) { d.x += d.vx; d.y += d.vy; }
  for (let i = dots.length - 1; i >= 0; i--) {
    if (Math.hypot(dots[i].x - arena.x, dots[i].y - arena.y) < 5) dots.splice(i, 1);
  }
}

function updateCollectibles() {
  for (const c of collectibles) { c.x += c.vx; c.y += c.vy; }
  for (let i = collectibles.length - 1; i >= 0; i--) {
    if (Math.hypot(collectibles[i].x - arena.x, collectibles[i].y - arena.y) < 5) collectibles.splice(i, 1);
  }
}

function drawHUD() {
  const liveTime = gameOver
    ? elapsedTime
    : ((performance.now() - startTime) / 1000).toFixed(2);

  // Place labels just outside the arena circle
  // Score: bottom-left of circle  (225° = bottom-left)
  // Timer: bottom-right of circle (315° = bottom-right)
  const offset = arena.radius + 28;

  // --- Score label (bottom-left outside circle) ---
  const scoreAngle = (225 * Math.PI) / 180;
  const sx = arena.x + Math.cos(scoreAngle) * offset;
  const sy = arena.y + Math.sin(scoreAngle) * offset;

  // red dot icon
  ctx.beginPath();
  ctx.arc(sx - 30, sy, 7, 0, Math.PI * 2);
  ctx.fillStyle = '#f33';
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('× ' + score, sx - 20, sy);

  // --- Timer label (bottom-right outside circle) ---
  const timeAngle = (315 * Math.PI) / 180;
  const tx = arena.x + Math.cos(timeAngle) * offset;
  const ty = arena.y + Math.sin(timeAngle) * offset;

  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('⏱ ' + liveTime + 's', tx + 30, ty);

  ctx.textBaseline = 'alphabetic';
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Arena circle
  ctx.beginPath();
  ctx.arc(arena.x, arena.y, arena.radius, 0, Math.PI * 2);
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Enemy dots (yellow)
  for (const d of dots) {
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ff0';
    ctx.fill();
  }

  // Collectibles (red)
  for (const c of collectibles) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#f33';
    ctx.fill();
  }

  // Player ball
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = gameOver ? '#f00' : '#09f';
  ctx.fill();

  // HUD outside the circle
  drawHUD();

  // Status text just above the circle
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  if (gameOver) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('Game Over!', arena.x, arena.y - arena.radius - 40);
    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#ccc';
    ctx.fillText('Survived: ' + elapsedTime + 's   |   Collected: ' + score + ' 🔴', arena.x, arena.y - arena.radius - 20);
  } else {
    ctx.fillStyle = '#555';
    ctx.font = '13px sans-serif';
    ctx.fillText('Avoid yellow · Collect red', arena.x, arena.y - arena.radius - 20);
  }

  if (!gameOver) {
    updateDots();
    updateCollectibles();
    checkDotCollisions();
    checkCollectibleCollisions();
  }

  requestAnimationFrame(draw);
}

setInterval(spawnDots, BASE_SPAWN_INTERVAL);
setInterval(spawnCollectibles, BASE_SPAWN_INTERVAL * 2);
setInterval(increaseDifficulty, DIFFICULTY_INTERVAL);

resetGame();
draw();
</script>
</body>
</html>
